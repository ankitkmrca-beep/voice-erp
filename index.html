<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice ERP System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 550px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 20px; color: #1a73e8; text-align: center; }

    .voice-section { background: #e8f0fe; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 25px; border: 1px solid #d2e3fc; }
    .mic-btn { background: #1a73e8; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
    .mic-btn.recording { background: #d93025; animation: pulse 1.5s infinite; }
    .status-text { margin-top: 10px; font-size: 14px; color: #5f6368; font-style: italic; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #3c4043; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px; }

    .btn-submit { width: 100%; background: #34a853; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .confirmation-box { background: #e6f4ea; border: 1px solid #b7e1cd; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>🎙️ Voice ERP System</h2>

  <!-- Voice Input Section -->
  <div class="voice-section">
    <button id="micBtn" class="mic-btn" onclick="toggleVoice()">🎙️ Tap to Speak Command</button>
    <div id="statusText" class="status-text">Tap mic, speak sale entry, and tap again to stop.</div>
  </div>

  <!-- Voice Confirmation Banner -->
  <div id="confirmationBox" class="confirmation-box">
    <strong>AI Extracted Entry:</strong>
    <p id="confirmText" style="margin-top:5px; font-weight: 500;"></p>
  </div>

  <!-- Entry Form -->
  <form id="erpForm" onsubmit="handleManualSubmit(event)">
    <div class="form-group">
      <label>Customer Name</label>
      <input type="text" id="customerName" required placeholder="e.g. Ankit">
    </div>

    <div class="form-group">
      <label>Item Description</label>
      <input type="text" id="itemDesc" required placeholder="e.g. Wheat Flour / AC">
    </div>

    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex: 1;">
        <label>Quantity</label>
        <input type="number" id="qty" value="1" required oninput="calculateTotal()">
      </div>

      <div class="form-group" style="flex: 1;">
        <label>Rate (₹)</label>
        <input type="number" id="rate" required oninput="calculateTotal()">
      </div>
    </div>

    <div class="form-group">
      <label>Total Amount (₹)</label>
      <input type="number" id="totalAmount" readonly>
    </div>

    <div class="form-group">
      <label>Payment Status</label>
      <select id="paymentStatus">
        <option value="Paid">Paid</option>
        <option value="Pending">Pending</option>
      </select>
    </div>

    <button type="submit" class="btn-submit">Save Sale & Generate Invoice</button>
  </form>
</div>

<script>
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE INSIDE DOUBLE QUOTES:
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGWB-89pA2TrJ7BEyegV6WMh43HVjOf8_-vayQKTvRnVWJq4vIA03N9_kw4yhGaRlA/exec";

  let recognition = null;
  let isListening = false;

  function calculateTotal() {
    const q = parseFloat(document.getElementById('qty').value) || 0;
    const r = parseFloat(document.getElementById('rate').value) || 0;
    document.getElementById('totalAmount').value = q * r;
  }

  async function toggleVoice() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("YOUR_APPS_SCRIPT_WEB_APP_URL_HERE")) {
      alert("Please paste your Google Apps Script Web App URL into APPS_SCRIPT_URL in index.html first!");
      return;
    }

    try {
      await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      alert("Microphone permission denied! Please allow mic access in browser settings.");
      return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Speech recognition is not supported in this browser. Please use Google Chrome.");
      return;
    }

    if (isListening && recognition) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'hi-IN';

    recognition.onstart = function() {
      isListening = true;
      const micBtn = document.getElementById("micBtn");
      micBtn.innerText = "🛑 Stop & Process";
      micBtn.classList.add("recording");
      document.getElementById("statusText").innerText = "🎙️ Listening... Speak now!";
    };

    recognition.onresult = async function(event) {
      const transcript = event.results[0][0].transcript;
      document.getElementById("statusText").innerText = `Heard: "${transcript}" — AI processing...`;
      await sendToBackend(transcript);
    };

    recognition.onerror = function(event) {
      document.getElementById("statusText").innerText = "Speech error: " + event.error;
      resetMicUI();
    };

    recognition.onend = function() {
      resetMicUI();
    };

    recognition.start();
  }

  function resetMicUI() {
    isListening = false;
    const micBtn = document.getElementById("micBtn");
    micBtn.innerText = "🎙️ Tap to Speak Command";
    micBtn.classList.remove("recording");
  }

  async function sendToBackend(transcriptText) {
    try {
      // Send payload with text/plain header and redirect follow to prevent CORS blocking
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        redirect: "follow",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({ transcript: transcriptText })
      });

      const res = await response.json();
      if (res.status === "success") {
        const d = res.data;
        fillFormFields(
          d.customerName || "Cash Customer",
          d.itemDesc || "General Goods",
          d.qty || 1,
          d.rate || 0,
          d.paymentStatus || "Paid"
        );
      } else {
        console.error("Backend Error:", res.message);
        document.getElementById("statusText").innerText = "Error: " + (res.message || "Could not parse speech");
      }
    } catch (err) {
      console.error("Fetch Error:", err);
      document.getElementById("statusText").innerText = "Connection error to Google Apps Script backend.";
    }
  }

  function fillFormFields(customer, item, qty, rate, paymentStatus) {
    document.getElementById("customerName").value = customer;
    document.getElementById("itemDesc").value = item;
    document.getElementById("qty").value = qty;
    document.getElementById("rate").value = rate;
    document.getElementById("paymentStatus").value = paymentStatus;

    calculateTotal();

    const total = qty * rate;
    document.getElementById("confirmText").innerText = `${customer} | ${qty}x ${item} | Rate: ₹${rate} | Total: ₹${total}`;
    document.getElementById("confirmationBox").style.display = "block";
    document.getElementById("statusText").innerText = `✅ Successfully Extracted: ${customer} bought ${item}`;
  }

  function handleManualSubmit(e) {
    e.preventDefault();
    alert("Sale Saved Successfully!");
  }
</script>

</body>
</html>
