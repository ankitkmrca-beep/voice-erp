<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice ERP System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 550px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 20px; color: #1a73e8; text-align: center; }

    .api-box { background: #fff8e1; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffe082; }
    .api-box input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; margin-top: 5px; }

    .voice-section { background: #e8f0fe; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 25px; border: 1px solid #d2e3fc; }
    .mic-btn { background: #1a73e8; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .mic-btn.recording { background: #d93025; animation: pulse 1.5s infinite; }
    .status-text { margin-top: 10px; font-size: 14px; color: #5f6368; font-style: italic; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #3c4043; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px; }

    .btn-submit { width: 100%; background: #34a853; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .confirmation-box { background: #e6f4ea; border: 1px solid #b7e1cd; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>🤖 AI Voice ERP System</h2>

  <!-- API Key Input -->
  <div class="api-box">
    <label for="apiKey">🔑 Groq API Key (Stored Locally):</label>
    <input type="password" id="apiKey" placeholder="gsk_..." onchange="saveApiKey(this.value)">
  </div>

  <!-- Voice Section -->
  <div class="voice-section">
    <button id="micBtn" class="mic-btn" onclick="toggleRecording()">🎙️ Tap to Speak (Any Language)</button>
    <div id="statusText" class="status-text">Ready. Tap mic and speak naturally.</div>
  </div>

  <!-- Voice Confirmation Banner -->
  <div id="confirmationBox" class="confirmation-box">
    <strong>AI Extracted Entry:</strong>
    <p id="confirmText" style="margin-top:5px; font-weight: 500;"></p>
  </div>

  <!-- Entry Form -->
  <form id="erpForm" onsubmit="handleManualSubmit(event)">
    <div class="form-group">
      <label>Customer Name</label>
      <input type="text" id="customerName" required placeholder="e.g. Ankit">
    </div>

    <div class="form-group">
      <label>Item Description</label>
      <input type="text" id="itemDesc" required placeholder="e.g. AC">
    </div>

    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex: 1;">
        <label>Quantity</label>
        <input type="number" id="qty" value="1" required oninput="calculateTotal()">
      </div>

      <div class="form-group" style="flex: 1;">
        <label>Rate (₹)</label>
        <input type="number" id="rate" required oninput="calculateTotal()">
      </div>
    </div>

    <div class="form-group">
      <label>Total Amount (₹)</label>
      <input type="number" id="totalAmount" readonly>
    </div>

    <div class="form-group">
      <label>Payment Status</label>
      <select id="paymentStatus">
        <option value="Paid">Paid</option>
        <option value="Pending">Pending</option>
      </select>
    </div>

    <button type="submit" class="btn-submit">Save Sale & Generate Invoice</button>
  </form>
</div>

<script>
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  // Load saved API Key from localStorage
  window.onload = () => {
    const savedKey = localStorage.getItem("groq_api_key");
    if (savedKey) document.getElementById("apiKey").value = savedKey;
  };

  function saveApiKey(key) {
    localStorage.setItem("groq_api_key", key.trim());
  }

  function calculateTotal() {
    const q = parseFloat(document.getElementById('qty').value) || 0;
    const r = parseFloat(document.getElementById('rate').value) || 0;
    document.getElementById('totalAmount').value = q * r;
  }

  async function toggleRecording() {
    const apiKey = document.getElementById("apiKey").value.trim();
    if (!apiKey) {
      alert("Please enter your Groq API Key at the top first!");
      return;
    }

    if (!isRecording) {
      startRecording();
    } else {
      stopRecording();
    }
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
      mediaRecorder.onstop = processAudioWithAI;

      mediaRecorder.start();
      isRecording = true;

      const micBtn = document.getElementById("micBtn");
      micBtn.innerText = "🛑 Stop & Process Audio";
      micBtn.classList.add("recording");
      document.getElementById("statusText").innerText = "🎙️ Listening... Speak now in any language!";
    } catch (err) {
      alert("Microphone access denied or not supported.");
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;

      const micBtn = document.getElementById("micBtn");
      micBtn.innerText = "🎙️ Tap to Speak (Any Language)";
      micBtn.classList.remove("recording");
      document.getElementById("statusText").innerText = "⏳ Processing audio with AI...";
    }
  }

  async function processAudioWithAI() {
    const apiKey = document.getElementById("apiKey").value.trim();
    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
    const formData = new FormData();
    formData.append('file', audioBlob, 'speech.webm');
    formData.append('model', 'whisper-large-v3');

    try {
      // Step 1: Transcribe using Groq Whisper API
      const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}` },
        body: formData
      });

      const data = await response.json();
      if (!data.text) throw new Error(data.error?.message || "Transcription failed");

      const transcript = data.text;
      document.getElementById("statusText").innerText = `Heard: "${transcript}"`;

      // Step 2: Parse Entity fields with Groq Llama 3
      await extractFieldsWithLLM(transcript, apiKey);

    } catch (err) {
      document.getElementById("statusText").innerText = "Error: " + err.message;
    }
  }

  async function extractFieldsWithLLM(text, apiKey) {
    const systemPrompt = `You are an AI sales entry assistant for an ERP app. 
Extract sales data from the user's spoken input (which may be in English, Hindi, Hinglish, or any language).
Return ONLY a raw JSON object with these keys:
{
  "customerName": string (default "Cash Customer"),
  "itemDesc": string (default "General Goods"),
  "qty": number (default 1),
  "rate": number (default 0),
  "paymentStatus": "Paid" or "Pending" (default "Paid")
}
Do not return markdown formatting, backticks, or extra text. Output strictly JSON.`;

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: text }
          ],
          temperature: 0.1
        })
      });

      const data = await response.json();
      const content = data.choices[0].message.content.trim();
      const cleanJson = content.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleanJson);

      // Fill Form Fields
      document.getElementById("customerName").value = parsed.customerName || "Cash Customer";
      document.getElementById("itemDesc").value = parsed.itemDesc || "General Goods";
      document.getElementById("qty").value = parsed.qty || 1;
      document.getElementById("rate").value = parsed.rate || 0;
      document.getElementById("paymentStatus").value = parsed.paymentStatus || "Paid";

      calculateTotal();

      const total = (parsed.qty || 1) * (parsed.rate || 0);
      document.getElementById("confirmText").innerText = `${parsed.customerName} | ${parsed.qty}x ${parsed.itemDesc} | Rate: ₹${parsed.rate} | Total: ₹${total}`;
      document.getElementById("confirmationBox").style.display = "block";
      document.getElementById("statusText").innerText = "✅ Successfully parsed by AI!";

    } catch (err) {
      document.getElementById("statusText").innerText = "AI Parsing Failed. Please check inputs manually.";
    }
  }

  function handleManualSubmit(e) {
    e.preventDefault();
    alert("Sale Saved Successfully!");
  }
</script>

</body>
</html>
